name: silentcity

services:
  web:
    image: node:24-alpine@sha256:116b800c3754b440ee0aa3ed2f20f5bf3d99a554bfd9adeea09ea8017f6e85f5
    container_name: silentcity-web
    user: '1000:1000'
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: ./.account.env
        required: false
    environment:
      ACCOUNT_ORIGIN: https://city.maark.ru
      ACCOUNT_DB: /data/accounts.sqlite
    command: ["node", "/app/account-server.mjs"]
    volumes:
      - ./account-server.mjs:/app/account-server.mjs:ro
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  proxy:
    image: caddy:2-alpine@sha256:24ec7b05bc532c7bb57f727030c5056e257ff7138b4b50460306819ff79362bd
    container_name: silentcity-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:3080:80"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
