server {
    listen 80;
    listen [::]:80;
    server_name city.maark.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/silentcity/acme;
    }
    location / {
        return 301 https://city.maark.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name city.maark.ru;
    ssl_certificate /etc/letsencrypt/live/city.maark.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/city.maark.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host city.maark.ru;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
